<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./zehen-icon.svg" />
    <title>ZEHEN — Smart billing &amp; business management software</title>

    <!-- Editorial dashboard fonts: Fraunces (display serif w/ italic flair),
         Geist (sans body), Geist Mono (tabular data values). Preloaded so
         the dashboard hits with correct typography on first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
    />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <!-- Pre-paint theme: reads the persisted Zustand store BEFORE React mounts
         and stamps data-theme on <html>. Without this, the first frame renders
         in default Classic-Light and then flickers to whatever the user picked
         — a flash of unstyled theme. This keeps first paint correct. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('erp-theme');
          var state = raw ? JSON.parse(raw).state : null;
          var style = (state && state.themeStyle === 'modern') ? 'modern' : 'classic';
          var app   = (state && state.appearance) ? state.appearance : 'system';
          if (app === 'system') {
            app = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
              ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = style + '-' + app;
        } catch (_) {
          document.documentElement.dataset.theme = 'classic-light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
