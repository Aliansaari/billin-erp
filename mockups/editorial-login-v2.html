<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — Modern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
 * Login — Modern (centered card only)
 *
 * Same visual system as the original editorial-login mockup:
 *   • Warm dark canvas with drifting radial-gradient mesh (terracotta + gold)
 *   • SVG grain overlay to kill banding
 *   • Glassy login card with backdrop-filter, inset highlight, soft border
 *   • Fraunces serif heading + italic subtitle
 *   • Terracotta primary button with soft glow
 *   • Subtle fade/scale entry animation on the card
 *
 * Removed from the original:
 *   • Top navigation bar
 *   • Left-column hero (headline, lede, meta stats)
 *   • 3D bill stack + mouse parallax
 *   • Bottom editorial strip
 *
 * Result: the card alone, perfectly centered, breathing against the mesh.
 */

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #0B0807;
  color: #F5EEE2;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow: hidden;
}
.serif { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; letter-spacing: -0.02em; }

/* ── background mesh ───────────────────────────────── */
.mesh {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  background:
    radial-gradient(800px 600px at 18% 20%, rgba(226, 106, 76, 0.22), transparent 60%),
    radial-gradient(700px 500px at 85% 10%, rgba(212, 165, 116, 0.16), transparent 60%),
    radial-gradient(900px 700px at 70% 90%, rgba(154, 76, 56, 0.18), transparent 60%),
    radial-gradient(600px 500px at 10% 90%, rgba(86, 50, 38, 0.22), transparent 60%);
  animation: drift 24s ease-in-out infinite alternate;
  filter: saturate(1.1);
}
@keyframes drift {
  0%   { transform: translate3d(0, 0, 0) scale(1); }
  50%  { transform: translate3d(-18px, 10px, 0) scale(1.04); }
  100% { transform: translate3d(12px, -8px, 0) scale(1); }
}

/* fine grain to kill banding */
.grain {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  opacity: .06; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.9'/></svg>");
}

/* ── centered card stage ───────────────────────────── */
.stage {
  position: relative; z-index: 5;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
}

/* ── Login card ─────────────────────────────────────── */
.login-card {
  width: 100%; max-width: 440px;
  padding: 44px 40px 36px;
  background: rgba(26, 23, 19, 0.72);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  border: 1px solid rgba(245, 238, 226, 0.10);
  border-radius: 20px;
  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.50),
    inset 0 1px 0 rgba(245, 238, 226, 0.05);
  position: relative;
  overflow: hidden;

  opacity: 0;
  transform: translateY(18px) scale(.985);
  animation: cardIn 1.1s cubic-bezier(.2, .7, .2, 1) .15s forwards;
}
@keyframes cardIn {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.login-card::before {
  content: '';
  position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(226, 106, 76, 0.55), transparent);
}

.login-card h2 {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: #F5EEE2;
  margin-bottom: 6px;
}
.login-card .sub {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 14.5px;
  color: #8F8372;
  margin-bottom: 32px;
}

.field-group { display: flex; flex-direction: column; gap: 18px; }

.f-label {
  display: block;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #8F8372;
  font-weight: 500;
  margin-bottom: 8px;
}
.f-input {
  width: 100%;
  height: 48px;
  padding: 0 15px;
  background: rgba(11, 8, 7, 0.55);
  border: 1px solid rgba(245, 238, 226, 0.12);
  border-radius: 9px;
  color: #F5EEE2;
  font: inherit; font-size: 15px;
  outline: none;
  transition: all .2s;
}
.f-input:hover  { border-color: rgba(245, 238, 226, 0.22); }
.f-input:focus  {
  border-color: rgba(226, 106, 76, 0.6);
  box-shadow: 0 0 0 3px rgba(226, 106, 76, 0.14);
  background: rgba(11, 8, 7, 0.75);
}
.f-input::placeholder { color: #6D6355; }

.primary-btn {
  width: 100%;
  height: 50px;
  margin-top: 12px;
  background: linear-gradient(135deg, #E26A4C, #B1472F);
  border: none;
  border-radius: 9px;
  color: #FDFAF2;
  font: inherit; font-weight: 600; font-size: 15px;
  letter-spacing: 0.02em;
  cursor: pointer;
  box-shadow:
    0 14px 30px rgba(226, 106, 76, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.15);
  transition: all .2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.primary-btn:hover  {
  transform: translateY(-1px);
  box-shadow:
    0 18px 40px rgba(226, 106, 76, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.18);
}
.primary-btn:active { transform: translateY(0); }
.primary-btn .kbd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  background: rgba(0, 0, 0, 0.22);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0;
}

.hint-card {
  margin-top: 20px;
  padding: 13px 15px;
  background: rgba(245, 238, 226, 0.04);
  border: 1px solid rgba(245, 238, 226, 0.08);
  border-radius: 9px;
  display: flex; align-items: center; gap: 11px;
}
.hint-card .ico {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  background: rgba(212, 165, 116, 0.16);
  color: #D4A574;
  border-radius: 7px;
  font-size: 14px;
  flex-shrink: 0;
}
.hint-card .text {
  font-family: 'Fraunces', serif; font-style: italic;
  font-size: 13px; color: #B2A791;
  line-height: 1.5;
}
.hint-card code {
  font-family: 'JetBrains Mono', monospace;
  font-style: normal;
  font-size: 12px;
  background: rgba(0, 0, 0, 0.28);
  border: 1px solid rgba(245, 238, 226, 0.08);
  border-radius: 3px; padding: 1px 6px;
  color: #F5EEE2;
}
</style>
</head>
<body>

<div class="mesh"></div>
<div class="grain"></div>

<div class="stage">
  <div class="login-card">
    <h2 class="serif">Welcome back.</h2>
    <div class="sub">Sign in to continue to your firm.</div>

    <div class="field-group">
      <div>
        <label class="f-label">Username</label>
        <input class="f-input" placeholder="admin" autofocus />
      </div>
      <div>
        <label class="f-label">Password</label>
        <input class="f-input" type="password" placeholder="••••••••••" />
      </div>
      <button class="primary-btn">Sign in <span class="kbd">Enter</span></button>
    </div>

    <div class="hint-card">
      <div class="ico">✦</div>
      <div class="text">
        First time? Try <code>admin</code> / <code>admin123</code> — we&rsquo;ll ask you to set a real password.
      </div>
    </div>
  </div>
</div>

</body>
</html>
